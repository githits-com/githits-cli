name: Mintlify changelog trigger

on:
  workflow_call:
    inputs:
      version:
        description: CLI version for logging only
        required: false
        type: string
    secrets:
      MINTLIFY_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: CLI version for logging only
        required: false
        type: string

permissions: {}

jobs:
  trigger-docs-changelog:
    runs-on: aks-deployment-runner
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Trigger Mintlify Draft changelog
        continue-on-error: true
        env:
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
          MINTLIFY_PROJECT_ID: ${{ vars.MINTLIFY_PROJECT_ID }}
          MINTLIFY_DRAFT_CHANGELOG_WORKFLOW_ID: ${{ vars.MINTLIFY_DRAFT_CHANGELOG_WORKFLOW_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for name in MINTLIFY_API_KEY MINTLIFY_PROJECT_ID MINTLIFY_DRAFT_CHANGELOG_WORKFLOW_ID; do
            if [ -z "${!name}" ]; then
              echo "::notice::Skipping Mintlify Draft changelog: $name is missing."
              exit 0
            fi
          done

          echo "Triggering Mintlify Draft changelog (CLI version: ${VERSION:-unspecified})"
          curl -fsS --connect-timeout 10 --max-time 30 --retry 2 --retry-max-time 120 -X POST \
            "https://api.mintlify.com/v1/workflow/${MINTLIFY_PROJECT_ID}/${MINTLIFY_DRAFT_CHANGELOG_WORKFLOW_ID}/trigger" \
            -H "Authorization: Bearer ${MINTLIFY_API_KEY}"
