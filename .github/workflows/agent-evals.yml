name: Agent Evals

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Evaluation surface
        type: choice
        options: [mcp, cli-comparison]
        default: mcp
      baseline_sha:
        description: Full baseline commit SHA for CLI comparison
        type: string
      candidate_sha:
        description: Full candidate commit SHA for CLI comparison
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

env:
  CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  cli-comparison:
    name: CLI skills / ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cli-comparison'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    env:
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      SHELL: /bin/bash
    steps:
      - name: Validate immutable revisions
        run: |
          set -euo pipefail
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/cli-skill-comparison"
          printf 'PAIR_OUT=%s/cli-skill-comparison\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout measurement harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: measurement
          persist-credentials: false

      - name: Checkout baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseline_sha }}
          path: old
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: new
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "measurement/.node-version"

      - name: Install pinned runtime and dependencies
        run: |
          set -euo pipefail
          npm install --global @openai/codex@0.172.0
          for tree in measurement old new; do
            (cd "$tree" && bun install --frozen-lockfile)
          done
          {
            uname -a
            bash --version
            node --version
            bun --version
            codex --version
            git -C measurement rev-parse HEAD
            git -C old rev-parse HEAD
            git -C new rev-parse HEAD
          } > "$PAIR_OUT/runtime.txt"

      - name: Initialize separate authenticated homes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          for arm in old new; do
            export CODEX_HOME="$RUNNER_TEMP/cli-comparison-auth-$arm"
            mkdir -p "$CODEX_HOME"
            printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
          done

      - name: Run matched CLI skill arms
        env:
          GITHITS_API_TOKEN: ${{ secrets.GITHITS_API_TOKEN }}
        working-directory: measurement
        run: |
          set -euo pipefail
          for arm in old new; do
            export CODEX_HOME="$RUNNER_TEMP/cli-comparison-auth-$arm"
            export ARM="$arm"
            bun -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const crypto = require("node:crypto");
              const arm = process.env.ARM;
              const target = path.join(process.env.GITHUB_WORKSPACE, arm);
              const out = path.join(process.env.PAIR_OUT, arm);
              const workloads = JSON.parse(fs.readFileSync("eval/agentic/suites.json", "utf8")).workloads.filter(w => w.suites.includes("stable-full"));
              const digest = file => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
              const inputs = Object.fromEntries(workloads.map(w => [w.path, digest(w.path)]));
              const skills = Object.fromEntries(["SKILL.md", "references/code-and-docs.md"].map(p => [p, digest(path.join(target, "skills/githits-code", p))]));
              fs.writeFileSync(path.join(process.env.PAIR_OUT, arm + "-inputs.json"), JSON.stringify({arm, order:["old", "new"], inputs, skills}, null, 2));
              const args = ["bun", "run", "agent:e2e", "--agent", "codex", "--surface", "skills", "--server", "local", "--model", "gpt-6-luna", "--reasoning-effort", "low", "--concurrency", "4", "--timeout", "300", "--target-root", target, "--out", out, ...workloads.flatMap(w => ["--workload", w.path])];
              const child = Bun.spawnSync(args, {stdout:"inherit", stderr:"inherit"});
              if (!fs.existsSync(path.join(out, "report.json"))) process.exit(child.exitCode || 1);
              fs.writeFileSync(path.join(process.env.PAIR_OUT, arm + "-exit.json"), JSON.stringify({exitCode:child.exitCode}));
            '
          done
          bun run agent:e2e:report --compare "$PAIR_OUT/old" "$PAIR_OUT/new" > "$PAIR_OUT/comparison.txt"

      - name: Upload both arms including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-skill-comparison-${{ matrix.os }}
          path: ${{ runner.temp }}/cli-skill-comparison
          if-no-files-found: warn
          retention-days: 14

  scenario:
    name: ${{ matrix.label }} agent eval
    if: >-
      inputs.mode != 'cli-comparison' &&
      (github.event_name != 'workflow_dispatch' || github.ref_name == 'main') &&
      (github.event_name != 'pull_request' ||
      ((github.event.label.name == 'agent-eval' || github.event.label.name == 'agent-eval-openrouter') &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: discovery
            label: Discovery
            suite: canary
            scenario: discovery
            workload-concurrency: 2
          - id: intent
            label: Intent
            suite: stable-full
            scenario: intent
            workload-concurrency: 4
          - id: full
            label: Full guidance
            suite: stable-full
            scenario: full
            workload-concurrency: 4
    steps:
      - name: Prepare scenario output
        run: |
          set -euo pipefail
          scenario_out="$RUNNER_TEMP/agent-eval-${{ matrix.id }}"
          mkdir -p "$scenario_out"
          printf 'scenario=%s\n' '${{ matrix.id }}' > "$scenario_out/execution-started.txt"

      - name: Checkout evaluated SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install selected Codex CLI
        env:
          CODEX_VERSION: ${{ github.event.label.name == 'agent-eval-openrouter' && '0.154.0' || 'latest' }}
        run: npm install --global "@openai/codex@$CODEX_VERSION"

      - name: Record Codex CLI version
        run: codex --version

      - name: Initialize isolated Codex home
        env:
          CODEX_HOME: ${{ runner.temp }}/agent-eval-codex-home-${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"

      - name: Authenticate Codex with API key
        if: github.event.label.name != 'agent-eval-openrouter'
        env:
          CODEX_HOME: ${{ runner.temp }}/agent-eval-codex-home-${{ matrix.id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key

      - name: Run ${{ matrix.label }} suite
        env:
          CODEX_HOME: ${{ runner.temp }}/agent-eval-codex-home-${{ matrix.id }}
          SCENARIO_OUT: ${{ runner.temp }}/agent-eval-${{ matrix.id }}
          GITHITS_API_TOKEN: ${{ secrets.GITHITS_API_TOKEN }}
          EVAL_LABEL: ${{ github.event.label.name || '' }}
          OPENROUTER_API_KEY: ${{ github.event.label.name == 'agent-eval-openrouter' && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          set -euo pipefail
          codex_args=()
          if [ "$EVAL_LABEL" = "agent-eval-openrouter" ]; then
            codex_args+=(--codex-config "$GITHUB_WORKSPACE/eval/agentic/openrouter.toml" --codex-report-format prompt-json)
          fi
          bun run agent:e2e:suite run \
            --suite "${{ matrix.suite }}" \
            --scenario "${{ matrix.scenario }}" \
            --concurrency "${{ matrix.workload-concurrency }}" \
            --out "$SCENARIO_OUT" \
            "${codex_args[@]}"

      - name: Upload ${{ matrix.label }} artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-eval-${{ matrix.id }}
          path: ${{ runner.temp }}/agent-eval-${{ matrix.id }}
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: Agent eval summary
    if: >-
      always() &&
      inputs.mode != 'cli-comparison' &&
      (github.event_name != 'workflow_dispatch' || github.ref_name == 'main') &&
      (github.event_name != 'pull_request' ||
      ((github.event.label.name == 'agent-eval' || github.event.label.name == 'agent-eval-openrouter') &&
      github.event.pull_request.head.repo.full_name == github.repository))
    needs: scenario
    runs-on: ubuntu-latest
    steps:
      - name: Prepare artifact directories
        run: mkdir -p "$RUNNER_TEMP/agent-eval-artifacts/discovery" "$RUNNER_TEMP/agent-eval-artifacts/intent" "$RUNNER_TEMP/agent-eval-artifacts/full"

      - name: Download discovery artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-eval-discovery
          path: ${{ runner.temp }}/agent-eval-artifacts/discovery

      - name: Download intent artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-eval-intent
          path: ${{ runner.temp }}/agent-eval-artifacts/intent

      - name: Download full guidance artifacts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-eval-full
          path: ${{ runner.temp }}/agent-eval-artifacts/full

      - name: Checkout evaluated SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render agent eval summary
        id: report
        continue-on-error: true
        env:
          REPORT_OUT: ${{ runner.temp }}/agent-eval-summary.md
        run: |
          set +e
          bun run agent:e2e:ci-report \
            --suite discovery="$RUNNER_TEMP/agent-eval-artifacts/discovery/suite.json" \
            --suite intent="$RUNNER_TEMP/agent-eval-artifacts/intent/suite.json" \
            --suite full="$RUNNER_TEMP/agent-eval-artifacts/full/suite.json" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out "$REPORT_OUT"
          report_status=$?
          set -e
          if [ "${{ needs.scenario.result }}" != "success" ]; then
            report_status=1
          fi
          if [ -f "$REPORT_OUT" ]; then
            cat "$REPORT_OUT" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Agent eval CI report"
              echo ""
              echo "Reporter did not produce a summary artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$report_status"

      - name: Export agent eval metrics to Braintrust
        id: braintrust
        if: always()
        continue-on-error: true
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          RESULT_OUT: ${{ runner.temp }}/agent-eval-braintrust-result.json
          BRAINTRUST_EVENT_NAME: ${{ github.event_name }}
          BRAINTRUST_CHANNEL: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
          BRAINTRUST_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          BRAINTRUST_PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          BRAINTRUST_RUN_ID: ${{ github.run_id }}
          BRAINTRUST_RUN_ATTEMPT: ${{ github.run_attempt }}
          BRAINTRUST_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          braintrust_args=(
            --suite "discovery=$RUNNER_TEMP/agent-eval-artifacts/discovery/suite.json"
            --suite "intent=$RUNNER_TEMP/agent-eval-artifacts/intent/suite.json"
            --suite "full=$RUNNER_TEMP/agent-eval-artifacts/full/suite.json"
            --project "githits-cli-agent-evals"
            --source github
            --channel "$BRAINTRUST_CHANNEL"
            --branch "$BRAINTRUST_BRANCH"
            --run-id "$BRAINTRUST_RUN_ID"
            --run-attempt "$BRAINTRUST_RUN_ATTEMPT"
            --run-url "$BRAINTRUST_RUN_URL"
            --result-out "$RESULT_OUT"
          )
          if [ "$BRAINTRUST_EVENT_NAME" = "pull_request" ]; then
            braintrust_args+=(--pr-number "$BRAINTRUST_PR_NUMBER")
          fi
          bun run agent:e2e:braintrust "${braintrust_args[@]}"
          if [ -f "$RESULT_OUT" ]; then
            node -e '
              const fs = require("node:fs");
              const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const lines = [];
              if (typeof result.experiment === "string") lines.push("- Braintrust experiment: " + result.experiment);
              if (typeof result.url === "string") lines.push("- Braintrust link: " + result.url);
              const base = result.baseExperiment;
              if (base === null) lines.push("- Braintrust base: none (bootstrap/no base)");
              else if (base && typeof base.id === "string" && typeof base.name === "string") lines.push("- Braintrust base: " + base.name + " (" + base.id + ")");
              if (lines.length > 0) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n" + lines.join("\n") + "\n");
            ' "$RESULT_OUT"
          fi

      - name: Finalize agent eval status
        if: always()
        env:
          SCENARIO_RESULT: ${{ needs.scenario.result }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          BRAINTRUST_OUTCOME: ${{ steps.braintrust.outcome }}
        run: |
          set -euo pipefail
          failed_stages=()
          if [ "$SCENARIO_RESULT" != "success" ]; then
            failed_stages+=("scenario=$SCENARIO_RESULT")
          fi
          if [ "$REPORT_OUTCOME" != "success" ]; then
            failed_stages+=("report=$REPORT_OUTCOME")
          fi
          if [ "$BRAINTRUST_OUTCOME" != "success" ]; then
            failed_stages+=("braintrust=$BRAINTRUST_OUTCOME")
          fi
          if [ "${#failed_stages[@]}" -gt 0 ]; then
            printf 'Agent eval failed stages: %s\n' "${failed_stages[*]}"
            exit 1
          fi
